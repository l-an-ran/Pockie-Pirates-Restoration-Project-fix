<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小小海贼王 (GameLoader 模式)</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        embed, object {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <embed src="/onepiece/GameLoader.swf"
           quality="high"
           bgcolor="#000000"
           width="100%"
           height="100%"
           align="middle"
           allowFullScreen="true"
           allowScriptAccess="always"
           flashvars="ip=127.0.0.1:8080&account=admin&officialUrl=http://127.0.0.1:8080&antiUrl=http://127.0.0.1:8080&chargeUrl=http://127.0.0.1:8080"
           type="application/x-shockwave-flash" />
</body>
</html>
